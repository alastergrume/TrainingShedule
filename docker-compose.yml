version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: training_schedule
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d training_schedule"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/training_schedule
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/training_schedule
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app worker --loglevel=info

  celery-beat:
    build: .
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/training_schedule
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data: