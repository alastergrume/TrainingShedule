x-app-env: &app-env
  DATABASE_URL: postgresql://user:password@postgres:5432/training_schedule
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
  TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS}
  VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
  VK_GROUP_ID: ${VK_GROUP_ID}
  VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE}
  VK_SECRET_KEY: ${VK_SECRET_KEY}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: ${DEBUG:-false}
  REMINDER_MINUTES_BEFORE: ${REMINDER_MINUTES_BEFORE:-60}
  ADMIN_NOTIFICATION_ENABLED: ${ADMIN_NOTIFICATION_ENABLED:-true}
  MINIAPP_URL: ${MINIAPP_URL:-http://localhost:8000}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: training_schedule
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d training_schedule"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app worker --loglevel=info

  celery-beat:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - ./src:/app/src
    command: celery -A src.celery_app beat --loglevel=info

  telegram-bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - ./src:/app/src
    command: python scripts/run_telegram_bot.py
    restart: unless-stopped

#  cloudflared:
#    image: cloudflare/cloudflared:latest
#    command: tunnel --url http://app:8000
#    depends_on:
#      - app
#    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
