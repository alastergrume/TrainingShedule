<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Invite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6fa; --card: #fff; --primary: #4f46e5; --primary-hover: #4338ca;
    --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
    --text: #1e293b; --muted: #64748b; --border: #e2e8f0; --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 28px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  .back-link { font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 12px; display: inline-block; }
  .back-link:hover { color: var(--primary); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-num.success { color: var(--success); }
  .stat-num.danger { color: var(--danger); }
  .stat-num.warning { color: var(--warning); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all .15s;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #16a34a; }
  .btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--bg); }
  .btn-outline.active { background: #eef2ff; border-color: var(--primary); color: var(--primary); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .status-msg { font-size: 13px; color: var(--muted); }
  .error-msg { font-size: 13px; color: var(--danger); font-weight: 500; }

  .settings-row { display: flex; gap: 16px; margin-bottom: 16px; align-items: flex-end; flex-wrap: wrap; }
  .settings-row .field { display: flex; flex-direction: column; gap: 4px; }
  .settings-row label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .settings-row input[type=number] {
    width: 100px; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; outline: none;
  }
  .settings-row input:focus { border-color: var(--primary); }
  .settings-row input.invalid { border-color: var(--danger); }

  .tabs { display: flex; gap: 4px; margin-bottom: 0; }
  .tab {
    padding: 8px 18px; border-radius: 8px 8px 0 0; border: 1px solid var(--border);
    border-bottom: none; background: var(--bg); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted);
  }
  .tab.active { background: var(--card); color: var(--primary); font-weight: 600; }

  .filter-bar { display: flex; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .filter-bar span { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .selected-info { margin-left: auto; font-size: 12px; color: var(--primary); font-weight: 500; }

  .card { background: var(--card); border-radius: 0 var(--radius) var(--radius) var(--radius); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); border-bottom: 2px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  th:hover { color: var(--text); }
  th .sort-icon { font-size: 10px; margin-left: 3px; opacity: .4; }
  th.sorted .sort-icon { opacity: 1; color: var(--primary); }
  th.no-sort { cursor: default; }
  th.no-sort:hover { color: var(--muted); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  tr.deactivated td { opacity: .5; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-invited { background: #d1fae5; color: #065f46; }
  .badge-error { background: #fee2e2; color: #991b1b; }
  .badge-active { background: #d1fae5; color: #065f46; }
  .badge-banned { background: #fee2e2; color: #991b1b; }
  .badge-deleted { background: #f3f4f6; color: #6b7280; }

  .pagination { display: flex; justify-content: center; gap: 6px; padding: 10px; }
  .pagination button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
  .pagination button:disabled { opacity: .4; cursor: not-allowed; }
  .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .vk-link { color: var(--primary); text-decoration: none; font-size: 12px; }
  .vk-link:hover { text-decoration: underline; }
  input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); }
  .empty-row { text-align: center; color: var(--muted); padding: 32px !important; }

  @media (max-width: 600px) { body { padding: 12px; } .settings-row input[type=number] { width: 70px; } }
</style>
</head>
<body>

<a href="/admin" class="back-link">&larr; Admin Panel</a>
<h1>VK Invite Friends</h1>

<div class="stats-grid" id="stats">
  <div class="stat-card"><div class="stat-num" id="st-friends">-</div><div class="stat-label">Friends</div></div>
  <div class="stat-card"><div class="stat-num" id="st-active">-</div><div class="stat-label">Active</div></div>
  <div class="stat-card"><div class="stat-num danger" id="st-deactivated">-</div><div class="stat-label">Deactivated</div></div>
  <div class="stat-card"><div class="stat-num" id="st-members">-</div><div class="stat-label">In Community</div></div>
  <div class="stat-card"><div class="stat-num warning" id="st-pending">-</div><div class="stat-label">Pending</div></div>
  <div class="stat-card"><div class="stat-num success" id="st-invited">-</div><div class="stat-label">Invited</div></div>
  <div class="stat-card"><div class="stat-num danger" id="st-errors">-</div><div class="stat-label">Errors</div></div>
</div>

<div class="settings-row">
  <div class="field">
    <label>Daily limit (max 40)</label>
    <input type="number" id="inp-limit" min="0" max="40" value="40">
  </div>
  <div class="field">
    <label>Delay (sec)</label>
    <input type="number" id="inp-delay" min="1" max="60" value="3">
  </div>
  <span class="error-msg" id="settings-error"></span>
</div>

<div class="toolbar">
  <button class="btn btn-primary" onclick="doSync()" id="btn-sync">Sync from VK</button>
  <button class="btn btn-success" onclick="doInviteAll()" id="btn-invite">Invite All Pending</button>
  <button class="btn btn-success" onclick="doInviteSelected()" id="btn-invite-sel" disabled>Invite Selected (<span id="sel-count">0</span>)</button>
  <span class="status-msg" id="status-msg"></span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="friends" onclick="switchTab('friends')">Friends</div>
  <div class="tab" data-tab="members" onclick="switchTab('members')">Community</div>
  <div class="tab" data-tab="invites" onclick="switchTab('invites')">Invites</div>
</div>

<div class="card">
  <div class="filter-bar" id="filter-bar">
    <span>Show:</span>
    <button class="btn btn-outline btn-sm active" data-alive="all" onclick="setAlive('all')">All</button>
    <button class="btn btn-outline btn-sm" data-alive="active" onclick="setAlive('active')">Active</button>
    <button class="btn btn-outline btn-sm" data-alive="deactivated" onclick="setAlive('deactivated')">Deactivated</button>
    <span class="selected-info" id="selected-info"></span>
  </div>
  <div style="overflow-x:auto">
    <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
const API_BASE = '/api/vk-invite';
let currentTab = 'friends';
let currentPage = 1;
let aliveFilter = 'all';
let sortBy = 'vk_user_id';
let sortDir = 'asc';
const perPage = 50;
const selected = new Set();

async function api(path, opts) {
  const r = await fetch(API_BASE + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
}

function setStatus(msg, isError) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = isError ? 'error-msg' : 'status-msg';
}

function getParams() {
  const limit = parseInt(document.getElementById('inp-limit').value);
  const delay = parseInt(document.getElementById('inp-delay').value);
  const errEl = document.getElementById('settings-error');
  let valid = true;

  document.getElementById('inp-limit').classList.remove('invalid');
  document.getElementById('inp-delay').classList.remove('invalid');
  errEl.textContent = '';

  if (isNaN(limit) || limit < 0 || limit > 40) {
    document.getElementById('inp-limit').classList.add('invalid');
    errEl.textContent = 'Limit: 0-40';
    valid = false;
  }
  if (isNaN(delay) || delay < 1 || delay > 60) {
    document.getElementById('inp-delay').classList.add('invalid');
    errEl.textContent += (errEl.textContent ? ', ' : '') + 'Delay: 1-60';
    valid = false;
  }
  return valid ? { limit, delay } : null;
}

async function loadStats() {
  try {
    const s = await api('/stats');
    document.getElementById('st-friends').textContent = s.total_friends;
    document.getElementById('st-active').textContent = s.active_friends;
    document.getElementById('st-deactivated').textContent = s.deactivated_friends;
    document.getElementById('st-members').textContent = s.total_members;
    document.getElementById('st-pending').textContent = s.pending;
    document.getElementById('st-invited').textContent = s.invited;
    document.getElementById('st-errors').textContent = s.errors;
  } catch(e) { console.error(e); }
}

async function loadSettings() {
  try {
    const s = await api('/settings');
    document.getElementById('inp-limit').value = s.daily_limit;
    document.getElementById('inp-delay').value = s.delay_seconds;
  } catch(e) {}
}

function switchTab(tab) {
  currentTab = tab;
  currentPage = 1;
  sortBy = 'vk_user_id';
  sortDir = 'asc';
  selected.clear();
  updateSelectionUI();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const fb = document.getElementById('filter-bar');
  fb.style.display = (tab === 'invites') ? 'none' : '';
  loadTable();
}

function setAlive(v) {
  aliveFilter = v;
  currentPage = 1;
  document.querySelectorAll('#filter-bar [data-alive]').forEach(b => b.classList.toggle('active', b.dataset.alive === v));
  loadTable();
}

function toggleSort(field) {
  if (sortBy === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
  else { sortBy = field; sortDir = 'asc'; }
  loadTable();
}

function updateSelectionUI() {
  const cnt = selected.size;
  document.getElementById('sel-count').textContent = cnt;
  document.getElementById('btn-invite-sel').disabled = cnt === 0;
  document.getElementById('selected-info').textContent = cnt > 0 ? `Selected: ${cnt}` : '';
}

function toggleAll(checked) {
  document.querySelectorAll('.row-cb').forEach(cb => {
    const id = parseInt(cb.dataset.id);
    if (checked) selected.add(id); else selected.delete(id);
    cb.checked = checked;
  });
  updateSelectionUI();
}

function toggleOne(id, checked) {
  if (checked) selected.add(id); else selected.delete(id);
  const allCb = document.getElementById('cb-all');
  if (allCb) allCb.checked = document.querySelectorAll('.row-cb:checked').length === document.querySelectorAll('.row-cb').length;
  updateSelectionUI();
}

function sortIcon(field) {
  if (sortBy !== field) return '<span class="sort-icon">&updownarrow;</span>';
  return `<span class="sort-icon">${sortDir === 'asc' ? '&uparrow;' : '&downarrow;'}</span>`;
}

async function loadTable() {
  const thead = document.getElementById('thead');
  const tbody = document.getElementById('tbody');
  const aliveParam = aliveFilter !== 'all' ? `&alive=${aliveFilter}` : '';

  let data;
  if (currentTab === 'friends') {
    thead.innerHTML = `<tr>
      <th class="no-sort" style="width:30px"><input type="checkbox" id="cb-all" onchange="toggleAll(this.checked)"></th>
      <th class="${sortBy==='vk_user_id'?'sorted':''}" onclick="toggleSort('vk_user_id')">VK ID ${sortIcon('vk_user_id')}</th>
      <th class="${sortBy==='first_name'?'sorted':''}" onclick="toggleSort('first_name')">First Name ${sortIcon('first_name')}</th>
      <th class="${sortBy==='last_name'?'sorted':''}" onclick="toggleSort('last_name')">Last Name ${sortIcon('last_name')}</th>
      <th class="no-sort">Status</th>
      <th class="${sortBy==='synced_at'?'sorted':''}" onclick="toggleSort('synced_at')">Synced ${sortIcon('synced_at')}</th>
    </tr>`;
    data = await api(`/friends?page=${currentPage}&per_page=${perPage}&sort_by=${sortBy}&sort_dir=${sortDir}${aliveParam}`);
    tbody.innerHTML = data.items.length ? data.items.map(f => {
      const cls = f.is_deactivated ? ' class="deactivated"' : '';
      const badge = f.is_deactivated
        ? `<span class="badge badge-${f.deactivated_reason==='banned'?'banned':'deleted'}">${f.deactivated_reason||'deactivated'}</span>`
        : '<span class="badge badge-active">active</span>';
      return `<tr${cls}>
        <td><input type="checkbox" class="row-cb" data-id="${f.id}" ${selected.has(f.id)?'checked':''} onchange="toggleOne(${f.id},this.checked)"></td>
        <td><a class="vk-link" href="https://vk.com/id${f.vk_user_id}" target="_blank">${f.vk_user_id}</a></td>
        <td>${esc(f.first_name)}</td><td>${esc(f.last_name)}</td>
        <td>${badge}</td><td>${fmtDate(f.synced_at)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="6" class="empty-row">No data. Click "Sync from VK".</td></tr>';

  } else if (currentTab === 'members') {
    thead.innerHTML = `<tr>
      <th class="${sortBy==='vk_user_id'?'sorted':''}" onclick="toggleSort('vk_user_id')">VK ID ${sortIcon('vk_user_id')}</th>
      <th class="${sortBy==='first_name'?'sorted':''}" onclick="toggleSort('first_name')">First Name ${sortIcon('first_name')}</th>
      <th class="${sortBy==='last_name'?'sorted':''}" onclick="toggleSort('last_name')">Last Name ${sortIcon('last_name')}</th>
      <th class="no-sort">Status</th>
      <th class="${sortBy==='synced_at'?'sorted':''}" onclick="toggleSort('synced_at')">Synced ${sortIcon('synced_at')}</th>
    </tr>`;
    data = await api(`/members?page=${currentPage}&per_page=${perPage}&sort_by=${sortBy}&sort_dir=${sortDir}${aliveParam}`);
    tbody.innerHTML = data.items.length ? data.items.map(m => {
      const cls = m.is_deactivated ? ' class="deactivated"' : '';
      const badge = m.is_deactivated
        ? `<span class="badge badge-${m.deactivated_reason==='banned'?'banned':'deleted'}">${m.deactivated_reason||'deactivated'}</span>`
        : '<span class="badge badge-active">active</span>';
      return `<tr${cls}>
        <td><a class="vk-link" href="https://vk.com/id${m.vk_user_id}" target="_blank">${m.vk_user_id}</a></td>
        <td>${esc(m.first_name)}</td><td>${esc(m.last_name)}</td>
        <td>${badge}</td><td>${fmtDate(m.synced_at)}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="5" class="empty-row">No data.</td></tr>';

  } else {
    thead.innerHTML = '<tr><th>VK ID</th><th>Name</th><th>Status</th><th>Error</th><th>Date</th></tr>';
    data = await api(`/invites?page=${currentPage}&per_page=${perPage}`);
    tbody.innerHTML = data.items.length ? data.items.map(i =>
      `<tr>
        <td><a class="vk-link" href="https://vk.com/id${i.vk_user_id}" target="_blank">${i.vk_user_id}</a></td>
        <td>${esc(i.first_name)} ${esc(i.last_name)}</td>
        <td><span class="badge badge-${i.status}">${i.status}</span></td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.error_message||'')}">${esc(i.error_message||'')}</td>
        <td>${fmtDate(i.created_at)}</td>
      </tr>`
    ).join('') : '<tr><td colspan="5" class="empty-row">No invites yet.</td></tr>';
  }
  renderPagination(data.total);
}

function renderPagination(total) {
  const pages = Math.ceil(total / perPage);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let html = `<button ${currentPage<=1?'disabled':''} onclick="goPage(${currentPage-1})">&laquo;</button>`;
  const start = Math.max(1, currentPage - 3);
  const end = Math.min(pages, currentPage + 3);
  if (start > 1) html += `<button onclick="goPage(1)">1</button><button disabled>...</button>`;
  for (let i = start; i <= end; i++)
    html += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (end < pages) html += `<button disabled>...</button><button onclick="goPage(${pages})">${pages}</button>`;
  html += `<button ${currentPage>=pages?'disabled':''} onclick="goPage(${currentPage+1})">&raquo;</button>`;
  el.innerHTML = html;
}
function goPage(p) { currentPage = p; loadTable(); }

async function doSync() {
  const btn = document.getElementById('btn-sync');
  btn.disabled = true;
  setStatus('Syncing...');
  try {
    const r = await api('/sync', { method: 'POST' });
    setStatus(`Synced: ${r.friends_synced} friends, ${r.members_synced} members`);
    loadStats(); loadTable();
  } catch(e) { setStatus('Sync failed: ' + e.message, true); }
  btn.disabled = false;
}

async function doInviteAll() {
  const p = getParams();
  if (!p) return;
  const btn = document.getElementById('btn-invite');
  btn.disabled = true;
  setStatus('Starting...');
  try {
    await api(`/invite/start?daily_limit=${p.limit}&delay_seconds=${p.delay}`, { method: 'POST' });
    setStatus('Invite task started (Celery). Refresh stats later.');
  } catch(e) { setStatus('Failed: ' + e.message, true); }
  btn.disabled = false;
}

async function doInviteSelected() {
  const p = getParams();
  if (!p) return;
  if (selected.size === 0) return;
  if (selected.size > 40) { setStatus('Cannot invite more than 40 at a time', true); return; }

  const btn = document.getElementById('btn-invite-sel');
  btn.disabled = true;
  setStatus(`Inviting ${selected.size} selected...`);
  try {
    await api('/invite/selected', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ friend_ids: [...selected], daily_limit: p.limit, delay_seconds: p.delay }),
    });
    setStatus(`Task started for ${selected.size} users.`);
    selected.clear();
    updateSelectionUI();
  } catch(e) { setStatus('Failed: ' + e.message, true); }
  btn.disabled = false;
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDate(iso) { if (!iso) return '-'; return new Date(iso).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

loadSettings();
loadStats();
loadTable();
</script>
</body>
</html>
